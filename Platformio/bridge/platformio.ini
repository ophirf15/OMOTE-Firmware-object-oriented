; Standalone OMOTE bridge firmware (C3 / S3). Run from this directory:
;   pio run -e esp32c3_bridge -t upload
; First-time WiFi: join AP "OMOTE-Bridge-Setup" on your phone (captive portal).

[platformio]
default_envs = esp32c3_bridge
; Authoritative JSON pack (incl. Commands_GoogleTV.json) for bridge LittleFS uploadfs
data_dir = ../data

[env]
; BleHost compiles ble_handler.cpp directly — do not link the full remote HAL/UI stack.
lib_ignore =
  Esp32HalImpl
  BasicUI
  JsonConfigUI
  LVGL++
  Device
  HomeAssistUI
  HardwareCreation
  Rev1HalImpl
  Rev5HalImpl
  SimHalImpl
monitor_speed = 115200
upload_speed = 921600
monitor_dtr = 0
monitor_rts = 0
lib_extra_dirs = ../lib
build_flags =
  -D OMOTE_BRIDGE_HOST=1
  -D OMOTE_BLE=1
  -D FS_PATH='"/littlefs/"'
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
  -D CONFIG_BT_ENABLED=1
  -D CONFIG_BT_NIMBLE_ENABLED=1
  -include esp_timer.h
board_build.filesystem = littlefs

[env:esp32c3_bridge]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2025.03.30/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 4MB
build_unflags = -flto
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
lib_deps =
  OmoteLink
  BleHost
  h2zero/NimBLE-Arduino@^1.4.3
  ESP32-BLE-Keyboard

[env:esp32s3_bridge]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2025.03.30/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.extra_flags = -DBOARD_HAS_PSRAM
board_upload.flash_size = 16MB
lib_deps =
  OmoteLink
  BleHost
  h2zero/NimBLE-Arduino@^1.4.3
  ESP32-BLE-Keyboard
